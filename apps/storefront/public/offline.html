<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2439">
<title>Sem conexao - BOVINE</title>
<style>
  :root { color-scheme: light }
  * { box-sizing: border-box }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #EEF2F6;
    color: #0F172A;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid #DCE3EC;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(14, 36, 57, 0.08);
    padding: 32px 24px;
    text-align: center;
  }
  img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 16px }
  h1 { font-size: 24px; line-height: 32px; margin: 0 0 8px }
  p { font-size: 17px; line-height: 26px; color: #3F4C5F; margin: 0 0 24px }
  button {
    width: 100%;
    min-height: 52px;
    background: #FE6B00;
    color: #fff;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { background: #A04100 }
  .help {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #DCE3EC;
    font-size: 15px;
    line-height: 24px;
    color: #3F4C5F;
  }
  .help strong { display: block; font-size: 17px; color: #0F172A }
  .help a { color: #0F172A; text-decoration: none; font-weight: 700 }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="BOVINE">
    <h1>Voce esta sem internet</h1>
    <p>Verifique o sinal do seu celular ou o Wi-Fi e toque no botao abaixo para tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
    <div class="help">
      <strong>Precisa falar com a loja?</strong>
      Telefone e WhatsApp:<br>
      <a href="tel:+553888086271">(38) 8808-6271</a>
    </div>
  </div>
</body>
</html>
